name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    # 注意：不要为此 job 设置 name，check 上下文名必须与
    # main 分支保护中的 required status check "verify" 严格一致，
    # 否则 auto-merge 会因 check 永不满足而永久挂起
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 静态检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 生产依赖安全审计
        run: pnpm audit --prod --audit-level high

      # - name: 安装 Playwright Chromium
      #   run: npx playwright install --with-deps chromium

      # - name: 端到端测试
      #   run: pnpm test:e2e
